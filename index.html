<title>Shekiro R. Raposas, MIS | Contact</title>
<style>
  :root { --bg:#e6f1ea; --card:#ffffff; --text:#12201a; --muted:#5f7468; --accent:#1e8a4c; --band:#0f3d26; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b120e; --card:#16201a; --text:#eef5f0; --muted:#95aa9c; --accent:#4ade80; --band:#07170e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg);
         color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { width:min(100%,400px); background:var(--card); border-radius:20px; overflow:hidden;
          box-shadow:0 10px 40px rgba(0,0,0,.15); text-align:center; }
  .band { height:110px; background:linear-gradient(135deg,var(--band),var(--accent)); }
  .photo { width:128px; height:128px; margin:-64px auto 0; border-radius:50%; border:5px solid var(--card);
           background:var(--accent); overflow:hidden; }
  .photo img { display:block; width:100%; height:100%; object-fit:cover; }
  .body { padding:18px 28px 28px; }
  h1 { margin:8px 0 2px; font-size:1.3rem; letter-spacing:.02em; }
  .roles { list-style:none; margin:0 0 22px; padding:0; color:var(--muted); font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; line-height:1.7; }
  a.row { display:block; padding:14px 0; border-top:1px solid rgba(128,128,128,.25);
          color:var(--accent); text-decoration:none; word-break:break-all; }
  a.row small { display:block; color:var(--muted); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
  a.btn { display:block; margin-top:18px; padding:13px; border-radius:12px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
</style>
